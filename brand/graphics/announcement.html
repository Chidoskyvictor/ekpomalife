<!doctype html>
<!--
  Ekpoma Life announcement graphic (1080x1350, Instagram/TikTok 4:5).
  Reusable: the words come from a post JSON in posts/ (see render.mjs). Brand: our sky, our blue,
  Boogaloo headlines, Plus Jakarta text, the logo, gold for money.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Boogaloo'; src: url('assets/boogaloo.woff2') format('woff2'); }
  @font-face { font-family: 'Jakarta'; src: url('assets/jakarta-latin.woff2') format('woff2'); font-weight: 200 800; }
  :root {
    --blue: #2f6fed;
    --blue-deep: #1747b8;
    --ink: #0f1c33;
    --ink-2: #44546f;
    --gold: #ffc531;
    --green: #16a34a;
    --paper: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; }
  body {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: 'Jakarta', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 1px 1px, rgba(47, 111, 237, 0.13) 1.6px, transparent 0) 0 0 / 28px 28px,
      linear-gradient(180deg, #cfe2ff 0%, #e7f0ff 45%, #f6f9ff 100%);
  }

  /* Top bar */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 48px 56px 0;
  }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 76px; height: 76px; border-radius: 22px; background: #fff; box-shadow: 0 10px 26px rgba(23, 71, 184, 0.22); }
  .brand b { font-family: 'Boogaloo'; font-weight: 400; font-size: 54px; letter-spacing: 0.01em; color: var(--ink); }
  .tag {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 22px; border-radius: 999px;
    background: var(--blue); color: #fff; font-weight: 800; font-size: 24px;
    box-shadow: 0 8px 20px rgba(23, 71, 184, 0.28);
  }
  .tag::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); }
  .tag span { color: #fff; }

  main { position: relative; flex: 1; padding: 40px 56px 0; }
  .kicker { font-weight: 800; font-size: 26px; letter-spacing: 0.14em; color: var(--blue); text-transform: uppercase; }
  h1 {
    margin-top: 14px;
    font-family: 'Boogaloo'; font-weight: 400;
    font-size: 104px; line-height: 0.98; letter-spacing: 0.005em;
  }
  h1 em { font-style: normal; color: var(--blue); }
  .lead { margin-top: 18px; max-width: 900px; font-size: 29px; line-height: 1.42; color: var(--ink-2); font-weight: 600; }
  .lead b { color: var(--ink); }

  /* Growth stats */
  .stats { display: flex; gap: 22px; margin-top: 28px; }
  .stat {
    flex: 1; padding: 26px 28px; border-radius: 30px; background: var(--paper);
    box-shadow: 0 14px 40px rgba(23, 71, 184, 0.13);
  }
  .stat strong { display: block; font-family: 'Boogaloo'; font-weight: 400; font-size: 70px; line-height: 1; color: var(--blue); }
  .stat span { display: block; margin-top: 6px; font-size: 26px; font-weight: 700; color: var(--ink-2); }

  /* The gift */
  .gift {
    position: relative; display: flex; align-items: center; gap: 28px;
    margin-top: 22px; padding: 24px 30px; border-radius: 34px;
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%);
    color: #fff; box-shadow: 0 18px 46px rgba(23, 71, 184, 0.32);
    overflow: hidden;
  }
  .gift::after {
    content: ''; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 197, 49, 0.45), transparent);
  }
  .gift img { position: relative; z-index: 1; width: 120px; height: 120px; flex: none; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.25)); }
  .gift small { display: block; font-size: 24px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #d6e2ff; }
  .gift strong { display: block; font-family: 'Boogaloo'; font-weight: 400; font-size: 92px; line-height: 1; color: var(--gold); }
  .gift span { display: block; font-size: 27px; font-weight: 700; }

  .sign { margin-top: 22px; font-size: 28px; font-weight: 600; color: var(--ink-2); }
  .sign b { display: block; margin-top: 2px; font-family: 'Boogaloo'; font-weight: 400; font-size: 54px; color: var(--ink); }
  .sign small { display: block; font-size: 24px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--blue); }

  /* Star burst badge */
  .burst {
    position: absolute; right: 60px; top: 70px; width: 220px; height: 220px;
    display: grid; place-items: center; text-align: center;
    background: var(--gold); color: var(--ink);
    clip-path: polygon(50% 0%, 61% 12%, 77% 6%, 80% 22%, 96% 25%, 90% 40%, 100% 52%, 88% 62%, 94% 78%, 78% 80%, 74% 96%, 59% 89%, 46% 100%, 37% 87%, 21% 93%, 19% 77%, 4% 72%, 11% 58%, 0% 46%, 12% 36%, 7% 20%, 23% 18%, 27% 3%, 41% 11%);
    transform: rotate(8deg);
  }
  .burst div { font-weight: 900; font-size: 24px; line-height: 1.1; text-transform: uppercase; }
  .burst b { display: block; font-family: 'Boogaloo'; font-weight: 400; font-size: 58px; line-height: 1; }

  /* Footer */
  .foot {
    display: flex; align-items: center; gap: 18px;
    margin: 0 40px 40px; padding: 18px 18px 18px 22px; border-radius: 34px;
    background: rgba(255, 255, 255, 0.92); box-shadow: 0 14px 40px rgba(23, 71, 184, 0.16);
  }
  .foot img { width: 58px; height: 58px; border-radius: 16px; }
  .foot b { flex: 1; font-family: 'Boogaloo'; font-weight: 400; font-size: 42px; color: var(--ink); }
  .foot span {
    padding: 16px 28px; border-radius: 999px;
    background: var(--blue); color: #fff; font-size: 30px; font-weight: 800;
  }
</style>
</head>
<body>
  <header class="top">
    <div class="brand"><img src="assets/logo.png" alt="" /><b>Ekpoma Life</b></div>
    <div class="tag" id="tag"></div>
  </header>
  <main>
    <p class="kicker" id="kicker"></p>
    <h1 id="headline"></h1>
    <p class="lead" id="lead"></p>
    <div class="stats" id="stats"></div>
    <div class="gift" id="gift"></div>
    <p class="sign" id="sign"></p>
    <div class="burst" id="burst"></div>
  </main>
  <footer class="foot"><img src="assets/logo.png" alt="" /><b>Live your AAU story.</b><span>ekpomalife.app</span></footer>
<script>
  // window.POST is set by render.mjs from posts/<name>.json; HTML fields allow <em>/<b>.
  function draw(p) {
    const $ = (id) => document.getElementById(id)
    $('tag').innerHTML = p.tag || ''
    $('kicker').textContent = p.kicker || ''
    $('headline').innerHTML = p.headline || ''
    $('lead').innerHTML = p.lead || ''
    $('stats').innerHTML = (p.stats || []).map((s) => `<div class="stat"><strong>${s.value}</strong><span>${s.label}</span></div>`).join('')
    $('stats').style.display = p.stats && p.stats.length ? '' : 'none'
    $('gift').innerHTML = p.gift ? `<img src="assets/${p.gift.icon || 'money-bag.png'}" alt="" /><div><small>${p.gift.kicker}</small><strong>${p.gift.amount}</strong><span>${p.gift.note}</span></div>` : ''
    $('gift').style.display = p.gift ? '' : 'none'
    $('sign').innerHTML = p.signed ? `${p.signedLead || 'With love,'}<b>${p.signed}</b>${p.role ? `<small>${p.role}</small>` : ''}` : ''
    $('burst').innerHTML = p.burst ? `<div><b>${p.burst.big}</b>${p.burst.small}</div>` : ''
    $('burst').style.display = p.burst ? '' : 'none'
  }
  if (window.POST) draw(window.POST)
  window.draw = draw
</script>
</body>
</html>
