<!DOCTYPE html>
<!--
  Ekpoma Life shell for Chesskit — https://github.com/GuillaumeSD/Chesskit (AGPL-3.0).
  Loads chesskit.org in an iframe; close returns to the Games app.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Chess</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: #0f1a14; }
    .shell { display: flex; height: 100%; flex-direction: column; }
    .top {
      display: flex; align-items: center; gap: 8px; flex: none;
      padding: 8px 10px max(8px, env(safe-area-inset-top));
      background: #0f1a14; color: #e8f0eb;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    .top button {
      width: 44px; height: 44px; border: 0; border-radius: 12px;
      background: rgba(255,255,255,0.12); color: #fff; font-size: 17px; font-weight: 800;
    }
    .top b { font-size: 15px; font-weight: 800; }
    iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: #111; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <button type="button" id="close" aria-label="Close game">✕</button>
      <b>Chess</b>
    </div>
    <iframe src="https://chesskit.org" title="Chesskit" allow="clipboard-read; clipboard-write"></iframe>
  </div>
  <script>
    function post(msg) {
      try { parent.postMessage({ source: 'ekpoma-game', game: 'chesskit', ...msg }, '*'); } catch (_) {}
    }
    document.getElementById('close').addEventListener('click', function () { post({ type: 'exit' }); });
  </script>
</body>
</html>
