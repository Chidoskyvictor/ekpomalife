<!DOCTYPE html>
<!-- Ludo for Ekpoma Life: our own code and art. Online matches are run by the server (ludo-live.ts). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Ludo</title>
  <link rel="stylesheet" href="ludo.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <button type="button" id="close" aria-label="Close game">✕</button>
      <div class="titles"><b>Ludo</b><span id="subtitle"></span></div>
      <span class="timer" id="timer"></span>
    </header>
    <div class="status" id="status" aria-live="polite">Loading…</div>
    <main class="boardWrap">
      <svg id="board" viewBox="0 0 15 15" role="img" aria-label="Ludo board"></svg>
    </main>
    <footer class="bottom">
      <div class="players" id="players"></div>
      <button type="button" id="dice" class="dice" disabled aria-label="Roll the dice">
        <span class="face" id="face"></span>
        <span class="label" id="diceLabel">Roll</span>
      </button>
    </footer>
    <div class="over" id="over" hidden>
      <div class="card">
        <strong id="overTitle"></strong>
        <span id="overSub"></span>
        <button type="button" id="again">Play again</button>
        <button type="button" id="leave" class="ghost">Close</button>
      </div>
    </div>
  </div>
  <script src="ludo.js"></script>
</body>
</html>
