<!DOCTYPE html>
<!--
  Ekpoma Life chess. Our own board and engine (game.js, engine.js); rules by chess.js
  (BSD-2, see chess.js.LICENSE.txt). Modes: pass & play, vs the phone, online (the Games
  app holds the socket; the server referees online games).
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Chess</title>
  <style>
    :root {
      --bg: #eef2fa; --bg2: #dfe7f5; --ink: #14203a; --ink2: #4a5a7a; --card: #ffffff; --line: rgb(20 32 58 / 0.12);
      --primary: #2f6fe0; --ok: #1f9d55; --bad: #d63a30; --gold: #f2b01e;
      --sq-l: #eef1f8; --sq-d: #6f8fc7; --sq-last-l: #f5e68a; --sq-last-d: #c9c25a; --sq-sel: #ffd23f;
      --frame: #2b3d66; --coord-l: #6f8fc7; --coord-d: #eef1f8;
      --wf: #fff9ea; --ws: #2a2433; --wh: rgb(60 50 40 / 0.45);
      --bf: #2f3445; --bs: #0b0d14; --bh: rgb(255 255 255 / 0.4);
      --btn: rgb(20 32 58 / 0.08);
    }
    :root[data-theme='dark'] {
      --bg: #0e1426; --bg2: #151d36; --ink: #e8eeff; --ink2: #9fb0d6; --card: #1b2542; --line: rgb(255 255 255 / 0.12);
      --sq-l: #aab6d6; --sq-d: #3f5688; --sq-last-l: #c8c27a; --sq-last-d: #8d8c3f; --sq-sel: #e0a820;
      --frame: #0a0f1e; --coord-l: #3f5688; --coord-d: #aab6d6;
      --btn: rgb(255 255 255 / 0.1);
    }
    * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: radial-gradient(ellipse at 50% 20%, var(--bg2), var(--bg) 70%); color: var(--ink); overflow: hidden; touch-action: manipulation;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .shell { --bsz: min(calc(100vw - 16px), calc(100dvh - 236px), 560px); display: flex; flex-direction: column; align-items: center; height: 100%;
      padding: max(6px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); gap: 8px; }
    .top { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 560px; flex: none; }
    .top button, .menu button, .over button {
      min-height: 44px; min-width: 44px; border: 0; border-radius: 14px; padding: 0 14px;
      background: var(--btn); color: var(--ink); font: inherit; font-size: 15px; font-weight: 700; transition: transform .12s; }
    button:active { transform: scale(0.96); }
    .top .title { flex: 1; min-width: 0; line-height: 1.15; }
    .top .title b { display: block; font-size: 18px; letter-spacing: .01em; }
    .top .title span { display: block; font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top button.danger { background: var(--bad); color: #fff; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: var(--bsz); flex: none;
      min-height: 50px; padding: 6px 10px; border-radius: 16px; background: var(--card); border: 2px solid transparent;
      box-shadow: 0 1px 0 var(--line); font-size: 14px; font-weight: 700; transition: border-color .2s, box-shadow .2s; }
    #topBar { margin-top: auto; }
    .status { margin-bottom: auto; }
    .bar.turn { border-color: var(--primary); box-shadow: 0 0 0 3px rgb(47 111 224 / 0.18); }
    .bar .who { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar .who span { overflow: hidden; text-overflow: ellipsis; }
    .av { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; font-style: normal; font-size: 14px; font-weight: 800;
      background: var(--wf); color: var(--ws); border: 2px solid var(--ws); }
    .av.b { background: var(--bf); color: #fff; border-color: var(--bs); }
    .bar .took { flex: 1; min-width: 0; display: flex; align-items: center; flex-wrap: nowrap; overflow: hidden; height: 22px; padding-left: 4px; }
    .bar .took svg.mini { width: 17px; height: 17px; flex: none; margin-right: -6px; }
    :root[data-theme='dark'] .took .pc.b { --ps: #b9c6e6; --pf: #3c4258; }
    .bar .took small { margin-left: 10px; font-size: 12px; font-weight: 800; color: var(--ok); }
    .bar .clock { font-variant-numeric: tabular-nums; background: var(--btn); border-radius: 10px; font-size: 16px; font-weight: 800;
      padding: 4px 10px; min-width: 66px; text-align: center; }
    .bar.turn .clock { background: var(--primary); color: #fff; }
    .bar .clock.low { background: var(--bad); color: #fff; animation: tick 1s steps(2) infinite; }
    @keyframes tick { 50% { opacity: .65; } }
    .board-wrap { position: relative; flex: none; padding: 6px; border-radius: 18px; background: var(--frame); box-shadow: 0 10px 26px rgb(10 20 50 / .35), inset 0 0 0 2px rgb(255 255 255 / .08); }
    .board { width: calc(var(--bsz) - 12px); height: calc(var(--bsz) - 12px);
      display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
      border-radius: 10px; overflow: hidden; }
    .sq { position: relative; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; background: var(--sq-l); color: inherit; }
    .sq.dark { background: var(--sq-d); }
    .sq.last { background: var(--sq-last-l); }
    .sq.dark.last { background: var(--sq-last-d); }
    .sq.sel { background: var(--sq-sel) !important; }
    .sq.check::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgb(255 60 50 / .95) 18%, rgb(255 60 50 / 0) 72%); animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
    .pc { --pf: var(--wf); --ps: var(--ws); --ph: var(--wh); }
    .pc.b { --pf: var(--bf); --ps: var(--bs); --ph: var(--bh); }
    .sq .piece { position: relative; width: 94%; height: 94%; pointer-events: none; filter: drop-shadow(0 2px 1.5px rgb(0 0 0 / .35)); transition: transform .12s; }
    .sq.sel .piece { transform: translateY(-4%) scale(1.06); }
    .sq .dot { position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgb(20 30 60 / .38); pointer-events: none; }
    .sq .ring { position: absolute; inset: 3%; border-radius: 50%; border: 4px solid rgb(20 30 60 / .4); pointer-events: none; }
    .sq .file, .sq .rank { position: absolute; font-size: 10px; font-weight: 800; pointer-events: none; color: var(--coord-l); }
    .sq.dark .file, .sq.dark .rank { color: var(--coord-d); }
    .sq .file { right: 3px; bottom: 1px; }
    .sq .rank { left: 3px; top: 1px; }
    .status { flex: none; min-height: 28px; font-size: 15px; font-weight: 800; text-align: center; color: var(--ink2); }
    .status.alert { color: var(--bad); }
    .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 12px;
      background: rgb(8 14 30 / .78); border-radius: 18px; z-index: 5; text-align: center; backdrop-filter: blur(2px); color: #fff; }
    .overlay.on { display: flex; }
    .card { display: flex; flex-direction: column; gap: 10px; align-items: stretch; width: min(100%, 300px); }
    .card h2 { font-size: 22px; } .card p { font-size: 14px; opacity: .85; }
    .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .card button { min-height: 48px; border: 0; border-radius: 14px; padding: 0 14px; font: inherit; font-size: 15px; font-weight: 800;
      background: var(--primary); color: #fff; }
    .card button.ghost { background: rgb(255 255 255 / .16); }
    .promo { display: flex; gap: 8px; justify-content: center; }
    .promo button { width: 62px; height: 62px; padding: 6px; background: var(--sq-l); border-radius: 14px; }
    .promo button .pc { width: 100%; height: 100%; }
    .shell.learn { --bsz: min(calc(100vw - 16px), calc(100dvh - 376px), 560px); }
    .coach { flex: none; width: min(100%, 560px); margin-bottom: 4px; padding: 10px 12px; border-radius: 14px;
      background: var(--card); font-size: 14px; line-height: 1.4; box-shadow: 0 1px 0 var(--line); }
    .coach[hidden] { display: none; }
    .coach p { margin-bottom: 8px; }
    .coach .row { justify-content: flex-start; }
    .coach button { min-height: 44px; border: 0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 800; background: var(--primary); color: #fff; }
    .coach button.ghost { background: var(--btn); color: var(--ink); }
    .coach button[hidden] { display: none; }
    .sq.hint { box-shadow: inset 0 0 0 4px var(--primary); }
    #learn { position: fixed; inset: 0; z-index: 20; display: none; background: var(--bg); overflow-y: auto;
      padding: max(10px, env(safe-area-inset-top)) 12px 16px; }
    #learn.on { display: block; }
    #learn .wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    #learn h2 { font-size: 20px; margin: 4px 0; } #learn p { font-size: 14px; color: var(--ink2); margin-bottom: 4px; }
    #learn button { min-height: 48px; border: 0; border-radius: 14px; padding: 0 14px; text-align: left; font: inherit; font-size: 15px; font-weight: 700; background: var(--card); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
    #learn button.primary { background: var(--primary); color: #fff; font-weight: 800; }
    #learn button.done::after { content: ' ✓'; color: var(--ok); }
    .chip.on { outline: 3px solid var(--gold); }
    @media (prefers-reduced-motion: reduce) { .sq.check::before, .bar .clock.low { animation: none; } }
  </style>
</head>
<body>
  <script>
    // Light/dark: the Games app passes ?theme=; otherwise follow the phone.
    (function () {
      var t = new URLSearchParams(location.search).get('theme')
      if (!t) { try { t = window.top.document.documentElement.dataset.theme } catch (_) {} }
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = t
    })()
  </script>
  <div class="shell" id="shell">
    <div class="top">
      <button type="button" id="close" aria-label="Close game">✕</button>
      <div class="title"><b>♟︎ Chess</b><span id="subtitle"></span></div>
      <button type="button" id="flip" aria-label="Flip board">⇅</button>
      <button type="button" id="again" aria-label="New game" hidden>↺</button>
      <button type="button" id="draw" hidden>Draw</button>
      <button type="button" id="resign" class="danger" hidden>Resign</button>
    </div>
    <div class="bar" id="topBar"><span class="who" id="topName"></span><span class="took" id="topTook"></span><span class="clock" id="topClock" hidden></span></div>
    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Chess board"></div>
      <div class="overlay" id="menu"><div class="card">
        <h2>Chess</h2>
        <button type="button" data-mode="learn">🎓 Learn to play</button>
        <button type="button" data-mode="local">👥 Pass &amp; play</button>
        <div class="row">
          <button type="button" class="ghost" data-mode="cpu" data-level="easy">🤖 Easy</button>
          <button type="button" class="ghost" data-mode="cpu" data-level="medium">🤖 Medium</button>
          <button type="button" class="ghost" data-mode="cpu" data-level="hard">🤖 Hard</button>
        </div>
        <p>Play the phone as white.</p>
      </div></div>
      <div class="overlay" id="promoBox"><div class="card"><h2>Promote to</h2><div class="promo" id="promo"></div></div></div>
      <div class="overlay" id="offer"><div class="card"><h2>Draw offered</h2><p id="offerText"></p>
        <button type="button" id="offerYes">Accept draw</button><button type="button" class="ghost" id="offerNo">Decline</button></div></div>
      <div class="overlay" id="over"><div class="card"><h2 id="overTitle"></h2><p id="overText"></p>
        <button type="button" id="overAgain">Play again</button>
        <button type="button" class="ghost" id="overView">View board</button>
        <button type="button" class="ghost" id="overClose">Close</button></div></div>
    </div>
    <div class="bar" id="botBar"><span class="who" id="botName"></span><span class="took" id="botTook"></span><span class="clock" id="botClock" hidden></span></div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="coach" id="coach" hidden>
      <p id="coachText"></p>
      <div class="row">
        <button type="button" id="coachHint" hidden>💡 Hint</button>
        <button type="button" id="coachUndo" class="ghost" hidden>↩ Take back</button>
        <button type="button" id="coachRetry" class="ghost" hidden>↺ Retry</button>
        <button type="button" id="coachLessons" class="ghost" hidden>☰ Lessons</button>
        <button type="button" id="coachNext" hidden>Next ▶</button>
      </div>
    </div>
  </div>
  <div id="learn"><div class="wrap">
    <button type="button" id="learnClose" aria-label="Close lessons" style="width:48px;text-align:center">✕</button>
    <h2>🎓 Learn chess</h2>
    <p>Short, hands-on lessons. Tap one to start, or play a real game with a coach who gives hints.</p>
    <div id="learnList" style="display:flex;flex-direction:column;gap:8px"></div>
    <button type="button" class="primary" id="learnCoach">🧑‍🏫 Play a game with a coach</button>
  </div></div>
  <script type="module" src="game.js"></script>
</body>
</html>
