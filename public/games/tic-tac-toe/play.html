<!DOCTYPE html>
<!-- Ekpoma Life — Tic tac toe (our own code; loaded by index.html inside the phone's Games app). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tic tac toe</title>
  <link rel="stylesheet" href="style.css" />
  <script src="game.js" defer></script>
</head>
<body>
  <main class="game">
    <div class="modes" role="radiogroup" aria-label="Who are you playing">
      <button type="button" role="radio" aria-checked="true" data-mode="friend">👥 Friend</button>
      <button type="button" role="radio" aria-checked="false" data-mode="cpu">📱 Phone</button>
    </div>

    <div class="score" aria-label="Score">
      <div class="side x"><b>X</b><span id="score-x">0</span></div>
      <div class="side draw"><b>Draw</b><span id="score-d">0</span></div>
      <div class="side o"><b>O</b><span id="score-o">0</span></div>
    </div>

    <p class="status" id="status" aria-live="polite">X to play</p>

    <div class="board" id="board" role="grid" aria-label="Board"></div>

    <button type="button" class="again" id="again">New round</button>
  </main>
</body>
</html>
