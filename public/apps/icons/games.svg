<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="0.55" stop-color="#3563e9"/>
      <stop offset="1" stop-color="#2a2fb8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ebff"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfdcff"/>
      <stop offset="1" stop-color="#9db6f5"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aec4fb"/>
      <stop offset="1" stop-color="#7893e6"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5a5f7a"/>
      <stop offset="0.5" stop-color="#1b1d2e"/>
      <stop offset="1" stop-color="#07080f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0b1a6b" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <rect width="120" height="120" fill="url(#glow)"/>
  <!-- confetti sparkles -->
  <g fill="#fff" opacity="0.8">
    <circle cx="16" cy="22" r="2"/><circle cx="104" cy="98" r="2.4"/><circle cx="96" cy="16" r="1.6"/>
  </g>
  <!-- eight ball, behind and right -->
  <g filter="url(#sh)">
    <circle cx="82" cy="78" r="23" fill="url(#ball)"/>
    <circle cx="82" cy="72" r="10" fill="#fff"/>
    <text x="82" y="77.5" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="15" fill="#111">8</text>
    <ellipse cx="73" cy="62" rx="7" ry="4" fill="#fff" opacity="0.35" transform="rotate(-30 73 62)"/>
  </g>
  <!-- die, front left -->
  <g filter="url(#sh)">
    <path d="M38 36 L62 46 L38 58 L14 46 Z" fill="url(#top)"/>
    <path d="M14 46 L38 58 L38 88 L14 76 Z" fill="url(#left)"/>
    <path d="M38 58 L62 46 L62 76 L38 88 Z" fill="url(#right)"/>
    <!-- top pips (5) -->
    <g fill="#2a2fb8">
      <ellipse cx="38" cy="47" rx="3" ry="1.8"/>
      <ellipse cx="27" cy="46.4" rx="2.6" ry="1.6"/><ellipse cx="49" cy="46.4" rx="2.6" ry="1.6"/>
      <ellipse cx="38" cy="41" rx="2.6" ry="1.6"/><ellipse cx="38" cy="53" rx="2.6" ry="1.6"/>
    </g>
    <!-- left face pips (3 diagonal) -->
    <g fill="#2a2fb8">
      <ellipse cx="21" cy="55" rx="2.4" ry="3" transform="rotate(-22 21 55)"/>
      <ellipse cx="26" cy="67" rx="2.4" ry="3" transform="rotate(-22 26 67)"/>
      <ellipse cx="31" cy="78" rx="2.4" ry="3" transform="rotate(-22 31 78)"/>
    </g>
    <!-- right face pips (2) -->
    <g fill="#fff">
      <ellipse cx="46" cy="64" rx="2.4" ry="3" transform="rotate(22 46 64)"/>
      <ellipse cx="55" cy="72" rx="2.4" ry="3" transform="rotate(22 55 72)"/>
    </g>
  </g>
  <!-- gold crown star, top right -->
  <g filter="url(#sh)">
    <path d="M90 14 l4.2 8.6 9.4 1.3 -6.8 6.6 1.7 9.4 -8.5 -4.5 -8.5 4.5 1.7 -9.4 -6.8 -6.6 9.4 -1.3 z" fill="url(#gold)" stroke="#fff3c4" stroke-width="1"/>
  </g>
</svg>
